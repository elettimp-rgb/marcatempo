<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Marcatempo</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4361ee">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marcatempo">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="viewLogin">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="login-card">
          <div class="login-header">
            <i class="bi bi-clock-history"></i>
            <h2 class="mt-2 mb-1">Marcatempo</h2>
            <p class="mb-0 small opacity-75">Gestione ore lavoro</p>
          </div>
          <div class="p-4">
            <div id="loginError" class="alert alert-danger d-none"></div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                  <input type="text" name="username" class="form-control" required autofocus>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password" name="password" class="form-control" required>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Accedi
              </button>
            </form>
            <hr class="my-4">
            <div class="text-center text-muted small">
              <i class="bi bi-shield-check"></i> Area riservata
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const API_URL = 'https://marcatempo-api.elettimp.workers.dev';
  const form = document.getElementById('loginForm');
  const errDiv = document.getElementById('loginError');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    const original = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Accesso...';
    btn.disabled = true;
    errDiv.classList.add('d-none');

    const username = form.querySelector('[name=username]').value.trim();
    const password = form.querySelector('[name=password]').value;

    fetch(API_URL + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(r => r.json())
      .then(res => {
        if (res && res.success) {
          try { localStorage.setItem('marcatempo_token', res.token); } catch(e) {}
          if (res.user.ruolo === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'collaboratore.html';
          }
        } else {
          errDiv.textContent = (res && res.error) || 'Errore';
          errDiv.classList.remove('d-none');
          btn.innerHTML = original;
          btn.disabled = false;
        }
      })
      .catch(err => {
        errDiv.textContent = 'Errore di rete: ' + err.message;
        errDiv.classList.remove('d-none');
        btn.innerHTML = original;
        btn.disabled = false;
      });
  });
})();
</script>

<script>
// Registra il Service Worker (PWA)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      console.log('[PWA] Service Worker registrato:', reg.scope);
    }).catch(function(err) {
      console.warn('[PWA] Errore registrazione SW:', err);
    });
  });
}
</script>

</body>
</html>
