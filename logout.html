<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Logout - Marcatempo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div class="text-center">
    <div class="spinner-border text-primary mb-3" style="width:3rem;height:3rem"></div>
    <p class="text-muted">Disconnessione in corso...</p>
  </div>
</div>
<script>
(function() {
  const API_URL = 'https://marcatempo-api.elettimp.workers.dev';
  let token = null;
  try { token = localStorage.getItem('marcatempo_token'); } catch(e) {}
  if (token) {
    fetch(API_URL + '/api/logout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    }).finally(function() {
      try { localStorage.removeItem('marcatempo_token'); } catch(e) {}
      window.location.href = 'index.html';
    });
  } else {
    window.location.href = 'index.html';
  }
})();
</script>
</body>
</html>
